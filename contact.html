<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.o">
    <title>portfolio contact form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
</head>

<div class="containar">

    <body>

        <div class="section-one">
            <h1 class="section-one__name">R.Hariharan</h1>
            <p class="section-one__role">Web Developer</p>
            <a class="section-one__contact" href="index.html">Home</a>
        </div>

        <div class="contact-form">
            <form>
                <table>
                    <tr>
                        <td><label>Name:</label></td>
                        <td><input type="text" placeholder="Enter Your Name" class="contact-form__input"></td>
                    </tr>
                    <tr>
                        <td><label>Email:</label></td>
                        <td><input type="text" placeholder="Enter Your Email" class="contact-form__input"></td>
                    </tr>
                    <tr>
                        <td><label>Message:</label></td>
                        <td><textarea rows="3" cols="25" placeholder="your Message"
                                class="contact-form__textarea"></textarea></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input type="submit" class="contact-form__submit"></td>
                    </tr>

                </table>
            </form>
        </div>
        <div class="section-five">
            <p class="section-five__title">Social media:
                <a href="https://www.instagram.com/hari_haran.r18/">instagram</a>
                <a href="https://www.linkedin.com/feed/">Linkedin</a>
            </p>
            <p class="section-five__desc">&copy;Hariharan</p>
        </div>

</div>
</body>

</html>
